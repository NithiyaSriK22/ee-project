# MediKiosk Production Reverse Proxy & WAF Configuration
# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_emergency:10m rate=60r/s;

# Upstream definitions
upstream backend_api {
    server backend:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream doctor_portal {
    server doctor-portal:80;
}

upstream kiosk_portal {
    server kiosk-frontend:80;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # Production TLS Termination (Hospital PKI or Let's Encrypt)
    ssl_certificate /etc/nginx/certs/medikiosk.crt;
    ssl_certificate_key /etc/nginx/certs/medikiosk.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Global Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Request Body Size Limitation (5MB for document uploads)
    client_max_body_size 5M;

    # Backend API Routing
    location /api/ {
        limit_req zone=api_general burst=20 nodelay;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    # Emergency Help Request - Dedicated high-capacity burst rate limit
    location /api/v1/kiosk/help-request {
        limit_req zone=api_emergency burst=50 nodelay;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Public Downtime Status Board
    location /status {
        proxy_pass http://backend_api/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Health & Readiness Probes
    location /health {
        proxy_pass http://backend_api/health;
    }

    # Doctor Portal Application
    location /portal/ {
        proxy_pass http://doctor_portal/;
        proxy_set_header Host $host;
    }

    # Kiosk Application (Segmented)
    location / {
        proxy_pass http://kiosk_portal;
        proxy_set_header Host $host;
    }
}
